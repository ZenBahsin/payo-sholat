name: Build & Release Payo Sholat APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Versi rilis GitHub (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      build_type:
        description: 'Tipe build APK (auto = Release jika Secrets keystore ada, selain itu Debug siap pasang)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - release
          - debug

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -n "${SDK_ROOT}" ] && [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare Keystores & Build Configuration
        id: config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Tentukan tag rilis
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${{ inputs.version_tag }}"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          # Siapkan debug.keystore (dari debug.keystore.base64, secret, atau buat otomatis via keytool)
          if [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 -d > debug.keystore
          fi

          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore tidak ditemukan di repo, membuat debug.keystore otomatis via keytool..."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Pastikan .env tersedia jika dibutuhkan Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          REQUESTED_TYPE="${{ inputs.build_type || 'auto' }}"
          HAS_RELEASE_SECRETS="false"
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${STORE_PASSWORD}" ] && [ -n "${KEY_PASSWORD}" ]; then
            HAS_RELEASE_SECRETS="true"
          fi

          if [ "${REQUESTED_TYPE}" = "release" ]; then
            if [ "${HAS_RELEASE_SECRETS}" != "true" ]; then
              echo "::error::Build tipe 'release' memerlukan GitHub Secrets: KEYSTORE_BASE64, STORE_PASSWORD, dan KEY_PASSWORD."
              exit 1
            fi
            RESOLVED_TYPE="release"
          elif [ "${REQUESTED_TYPE}" = "debug" ]; then
            RESOLVED_TYPE="debug"
          else
            if [ "${HAS_RELEASE_SECRETS}" = "true" ]; then
              RESOLVED_TYPE="release"
            else
              RESOLVED_TYPE="debug"
            fi
          fi

          if [ "${RESOLVED_TYPE}" = "release" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          fi

          echo "build_type=${RESOLVED_TYPE}" >> "$GITHUB_OUTPUT"
          echo "Menggunakan mode build: ${RESOLVED_TYPE} untuk rilis ${RELEASE_TAG}"

      - name: Build Signed Release APK
        if: steps.config.outputs.build_type == 'release'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Build Installable APK (Default Signing)
        if: steps.config.outputs.build_type == 'debug'
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Release APK Artifact
        id: package
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.config.outputs.release_tag }}"
          TYPE="${{ steps.config.outputs.build_type }}"

          if [ "${TYPE}" = "release" ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
            DEST_NAME="PayoSholat-${TAG}-release.apk"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
            DEST_NAME="PayoSholat-${TAG}.apk"
          fi

          if [ ! -f "${SRC_APK}" ]; then
            echo "::error::File APK tidak ditemukan di ${SRC_APK}"
            exit 1
          fi

          cp "${SRC_APK}" "release-artifacts/${DEST_NAME}"
          (cd release-artifacts && sha256sum "${DEST_NAME}" > "${DEST_NAME}.sha256")

          echo "apk_path=release-artifacts/${DEST_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${DEST_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha_path=release-artifacts/${DEST_NAME}.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.release_tag }}
          name: Payo Sholat! ${{ steps.config.outputs.release_tag }}
          generate_release_notes: true
          body: |
            ## Payo Sholat! (${{ steps.config.outputs.release_tag }})

            - **File APK**: `${{ steps.package.outputs.apk_name }}`
            - **Tipe Build**: `${{ steps.config.outputs.build_type }}`

            ### Cara Install di HP Android
            1. Unduh file **`${{ steps.package.outputs.apk_name }}`** di bagian **Assets** di bawah ini.
            2. Buka file APK yang sudah diunduh di HP Android Anda.
            3. Jika diminta, izinkan **Install dari sumber tidak dikenal (Install unknown apps)**, lalu ketuk **Install**.
          files: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.sha_path }}
